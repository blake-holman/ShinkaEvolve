<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShinkaEvolve runs</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="favicon.png" alt="" class="logo">
            <div class="header__text">
                <h1>ShinkaEvolve</h1>
                <p class="muted">Runs</p>
            </div>
            <span class="spacer"></span>
            <label class="search" for="search-input">
                <input type="search" id="search-input" placeholder="Filter runs" autocomplete="off">
                <span class="search__hint"><kbd>/</kbd> focus <kbd>Esc</kbd> clear</span>
            </label>
            <a class="btn" href="https://github.com/SakanaAI/ShinkaEvolve" target="_blank" rel="noopener" title="ShinkaEvolve on GitHub">GitHub</a>
            <button class="btn btn--icon" id="btn-theme" title="Switch between light and dark theme" aria-label="Toggle theme">&#9680;</button>
        </header>

        <div id="loading-state" class="loading">
            <div class="spinner"></div>
            <div class="muted">Scanning for runs&hellip;</div>
        </div>

        <div id="empty-state" class="empty" hidden>
            <div class="empty__title" id="empty-title">No runs found</div>
            <div class="muted" id="empty-text">Run an evolution experiment to see its results here.</div>
        </div>

        <div id="table-wrapper" class="card card--table" hidden>
            <table id="results-table" class="runs">
                <thead>
                    <tr>
                        <th class="sortable" id="sort-run" data-sort="run" title="Sort by run name">Run <span class="sort-indicator"></span></th>
                        <th>Status</th>
                        <th class="numeric">Best score</th>
                        <th class="numeric" title="Number of generations so far (numbered from 0)">Generations</th>
                        <th class="numeric">Programs</th>
                        <th class="numeric" title="LLM, embedding, novelty, and meta cost of every program and failed proposal, plus prompt evolution">Cost</th>
                        <th class="numeric">Runtime</th>
                        <th class="sortable numeric" id="sort-updated" data-sort="updated" title="Sort by last update">Updated <span class="sort-indicator"></span></th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>
    </div>

    <script type="module" src="/static/js/index.js"></script>
</body>
</html>
